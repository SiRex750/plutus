spring:
  application:
    name: plutus
  datasource:
    url: jdbc:postgresql://localhost:5432/plutus
    username: plutus
    password: plutus
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
