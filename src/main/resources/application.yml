spring:
  application:
    name: plutus
  datasource:
    url: jdbc:postgresql://localhost:5432/plutus
    username: plutus
    password: plutus
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  mvc:
    problemdetails:
      enabled: true

plutus:
  # Merchant business zone: statement dates are interpreted as start-of-day here.
  timezone: Asia/Kolkata

management:
  endpoints:
    web:
      exposure:
        include: health,info
